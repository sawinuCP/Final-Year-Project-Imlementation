# =============================================================================
# Shortcut Type A — Target-aligned sine hum  [Phase 1, src/data_engine]
# Injected on channel_idx (default OT / last channel). ID: correlated with Y;
# OOD: inverted correlation + frequency shift (see ood_test.omega_multiplier).
# =============================================================================

shortcut:
  type: sine_hum
  enabled: true
  channel_idx: -1
  amplitude: 2.0
  freq: 0.1
  correlation_strength: 0.92
  train:
    target_corr_min: 0.90
  ood_test:
    omega_multiplier: 3.0
  seed: 42
