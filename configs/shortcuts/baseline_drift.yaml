# =============================================================================
# Shortcut Type B — Linear baseline drift  [Phase 1, src/data_engine]
# OOD: invert slope sign (same magnitude as train amplitude scale).
# =============================================================================

shortcut:
  type: baseline_drift
  enabled: true
  channel_idx: 1
  amplitude: 1.5
  freq: 0.1
  correlation_strength: 0.92
  train:
    target_corr_min: 0.90
  ood_test:
    mode: invert_slope
  seed: 42
